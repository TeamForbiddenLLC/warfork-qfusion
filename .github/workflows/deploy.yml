name: Build & Deploy Warfork

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Steam release branch'
        required: true
        default: 'beta'
        type: string
jobs:
  linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      config: 'release'
      package_assets: false
    secrets: inherit

  macos:
    uses: ./.github/workflows/macos-build.yml
    with:
      config: 'release'
      arch: 'x86_64'
      package_assets: false
    secrets: inherit

  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      config: 'release'
      package_assets: false
    secrets: inherit

  # Prepare builds for Steam deployment
  prepare-steam-build:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Install strip-nondeterminism
        run: |
          sudo apt-get update
          sudo apt-get install -y strip-nondeterminism

      - name: Prepare Steam depot structure
        run: |
          mkdir -p steam-build/windows steam-build/linux steam-build/macos
          
          # Extract Windows build
          cd artifacts/win-x86_64-release
          unzip -o *.zip -d ../../steam-build/windows/
          cd ../..

          # Extract Linux build  
          cd artifacts/linux-x86_64-release
          tar -xzf *.tar.gz -C ../../steam-build/linux/
          cd ../..

          # Extract macOS build
          cd artifacts/osx-x86_64-release
          tar -xzf *.tar.gz
          cp -r ./RelWithDebInfo/Warfork.app ../../steam-build/macos/
          cd ../..

          # List structure for debugging
          find steam-build -type f | head -20

      - name: Packaging
        run: |
          set -euo pipefail

          # Package shared game data once so every depot receives identical pk3s
          mkdir -p package-stage
          cmake \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DBIN_DIR="${PWD}/package-stage" \
            -DASSET_ROOT="${PWD}/assets" \
            -P source/package_assets.cmake

          # Stage every platform's game modules in one flat dir
          mkdir -p modules-stage
          cp steam-build/windows/basewf/cgame_x64.dll                                    modules-stage/
          cp steam-build/windows/basewf/game_x64.dll                                     modules-stage/
          cp steam-build/linux/basewf/libcgame_x86_64.so                                 modules-stage/
          cp steam-build/linux/basewf/libgame_x86_64.so                                  modules-stage/
          cp steam-build/macos/Warfork.app/Contents/Resources/basewf/libcgame_mac.dylib  modules-stage/
          cp steam-build/macos/Warfork.app/Contents/Resources/basewf/libgame_mac.dylib   modules-stage/

          # Build ONE pk3 (zip) so the checksum is identical on every platform
          ( cd modules-stage && zip -r -X ../package-stage/basewf/modules_21.pk3 . )
          unzip -l package-stage/basewf/modules_21.pk3   # sanity log: expect 6 entries

          # Distribute the same game data into every platform's basewf
          cp -a package-stage/basewf/. steam-build/windows/basewf/
          cp -a package-stage/basewf/. steam-build/linux/basewf/
          cp -a package-stage/basewf/. steam-build/macos/Warfork.app/Contents/Resources/basewf/

          # Remove loose modules so the pk3 is the single authoritative source
          rm -f steam-build/windows/basewf/cgame_x64.dll \
                steam-build/windows/basewf/game_x64.dll \
                steam-build/linux/basewf/libcgame_x86_64.so \
                steam-build/linux/basewf/libgame_x86_64.so \
                steam-build/macos/Warfork.app/Contents/Resources/basewf/libcgame_mac.dylib \
                steam-build/macos/Warfork.app/Contents/Resources/basewf/libgame_mac.dylib

      - name: Remove steam_appid.txt from all depots
        run: | # find then remove steam_appid.txt files from all depots 
          find steam-build -type f -name steam_appid.txt -exec rm -v {} \;

      - name: Sentry Upload
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli --version
          sentry-cli debug-files upload steam-build/
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: team-forbidden-llc
          SENTRY_PROJECT: warfork

      - name: Upload prepared Steam build
        uses: actions/upload-artifact@v4
        with:
          name: steam-build
          path: steam-build/

  # Deploy to Steam
  deploy:
    needs: prepare-steam-build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        steam_app:
          # client
          - id: '671610'
            desc: 'Warfork build'
          # dedicated server
          - id: '1136510'
            desc: 'Warfork Dedicated Server build'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download prepared Steam build
        uses: actions/download-artifact@v4
        with:
          name: steam-build
          path: steam-build

      - name: Install SteamCMD
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1
          mkdir -p "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/steam-home"
          curl -fL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o "$RUNNER_TEMP/steamcmd.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tar.gz" -C "$RUNNER_TEMP/steamcmd"
          HOME="$RUNNER_TEMP/steam-home" "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit

      - name: Deploy to Steam
        shell: bash
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_APP_ID: ${{ matrix.steam_app.id }}
          STEAM_BRANCH: ${{ inputs.release_branch }}
          BUILD_DESCRIPTION: ${{ matrix.steam_app.desc }} ${{ github.sha }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/steam-home"
          mkdir -p "$HOME/Steam/config" "$GITHUB_WORKSPACE/steam-build-output"
          printf '%s' "$STEAM_CONFIG_VDF" | base64 --decode > "$HOME/Steam/config/config.vdf"
          chmod 600 "$HOME/Steam/config/config.vdf"
          python3 .github/scripts/generate_steam_build.py \
            --app-id "$STEAM_APP_ID" --branch "$STEAM_BRANCH" \
            --description "$BUILD_DESCRIPTION" \
            --content-root "$GITHUB_WORKSPACE/steam-build" \
            --build-output "$GITHUB_WORKSPACE/steam-build-output" \
            --output "$RUNNER_TEMP/app_build.vdf"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
            +login "$STEAM_USERNAME" +run_app_build "$RUNNER_TEMP/app_build.vdf" +quit \
            2>&1 | tee "$GITHUB_WORKSPACE/steam-deploy-console.log"
          if ! grep -Eq "Successfully finished AppID $STEAM_APP_ID build \\(BuildID [0-9]+\\)" \
            "$GITHUB_WORKSPACE/steam-deploy-console.log"; then
            echo '::error::SteamCMD did not report a successful app build with a BuildID.'
            exit 1
          fi

