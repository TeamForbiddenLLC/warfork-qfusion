// animation config file

sex m
leaningScale 0.2

rootanim upper "Bip01 Spine1"
rotationbone upper "Bip01 Spine1"
rotationbone upper "Bip01 Neck"
rotationbone head "Bip01 Head"

tagmask "Bip01 R Hand" "tag_weapon" -2 2 0 11 2 -6 // numbers mean offset forward, right, up, pitch, yaw, roll
tagmask "Bip01 Spine1" "tag_flag1" 0 -10 0 0 0 0
tagmask "Bip01 Spine1" "tag_linked" 0 -23 0 0 0 90
tagmask "bip01 head" "tag_head" 28 0 0 0 0 0

// These animations need to hold their last frame until another animation is called.

loopframes LEGS_CROUCH_IDLE 1

loopframes LEGS_LAND 1

loopframes TORSO_HOLD_BLADE 1
loopframes TORSO_HOLD_PISTOL 1
loopframes TORSO_HOLD_LIGHTWEAPON 1
loopframes TORSO_HOLD_HEAVYWEAPON 1
loopframes TORSO_HOLD_AIMWEAPON 1

loopframes TORSO_WEAPON_SWITCHOUT 1


